<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RAG Simulator</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      min-height: 100vh;
      padding: 30px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 42px;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    h2 {
      margin-bottom: 15px;
      color: #93c5fd;
    }

    textarea {
      width: 100%;
      height: 140px;
      border-radius: 10px;
      border: none;
      padding: 12px;
      resize: vertical;
      margin-bottom: 15px;
      background: rgba(255,255,255,0.12);
      color: white;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #7c3aed, #06b6d4);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      opacity: 0.9;
      transform: scale(1.01);
    }

    .step {
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      border-left: 4px solid transparent;
      transition: 0.3s;
    }

    .active {
      border-left: 4px solid #22c55e;
      background: rgba(34,197,94,0.15);
    }

    .output-section {
      margin-bottom: 20px;
    }

    .label {
      color: #67e8f9;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .box {
      background: rgba(0,0,0,0.3);
      padding: 12px;
      border-radius: 10px;
      line-height: 1.5;
      overflow-wrap: break-word;
    }

    .chip {
      display: inline-block;
      background: rgba(124,58,237,0.3);
      padding: 8px 12px;
      border-radius: 999px;
      margin: 5px;
      font-size: 13px;
    }

    .response {
      background: rgba(6,182,212,0.15);
      border: 1px solid rgba(6,182,212,0.3);
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>

<body>

<div class="container">

  <h1>RAG Simulator</h1>
  <p class="subtitle">
    Understand Retrieval-Augmented Generation step-by-step
  </p>

  <div class="grid">

    <!-- LEFT -->
    <div class="card">

      <h2>Knowledge Base</h2>

      <textarea id="kb">
RAG stands for Retrieval-Augmented Generation.
Vector embeddings convert text into numerical semantic representations.
Documents are divided into chunks before vector indexing.
Similarity search retrieves the most relevant chunks.
LLMs generate grounded responses using retrieved context.
RAG reduces hallucinations in AI systems.
      </textarea>

      <h2>User Query</h2>

      <textarea id="query">How does RAG improve LLM responses?</textarea>

      <button onclick="runRAG()">
        Run RAG Simulation
      </button>

    </div>

    <!-- RIGHT -->
    <div class="card">

      <h2>RAG Pipeline</h2>

      <div id="step1" class="step">1. Chunk documents</div>
      <div id="step2" class="step">2. Create embeddings</div>
      <div id="step3" class="step">3. Convert query into embedding</div>
      <div id="step4" class="step">4. Similarity search</div>
      <div id="step5" class="step">5. Prompt augmentation</div>
      <div id="step6" class="step">6. LLM response generation</div>

      <br>

      <div id="output"></div>

    </div>

  </div>

</div>

<script>

function clearSteps() {
  const steps = document.querySelectorAll(".step");
  steps.forEach(step => {
    step.classList.remove("active");
  });
}

function activateStep(id) {
  clearSteps();
  document.getElementById(id).classList.add("active");
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function createEmbedding(text) {
  return text
    .toLowerCase()
    .replace(/[^\w\s]/g, "")
    .split(" ")
    .filter(word => word.length > 2);
}

function similarityScore(queryWords, docWords) {

  let score = 0;

  queryWords.forEach(word => {
    if (docWords.includes(word)) {
      score++;
    }
  });

  return score;
}

async function runRAG() {

  const output = document.getElementById("output");

  output.innerHTML = "";

  const kbText = document.getElementById("kb").value;
  const query = document.getElementById("query").value;

  const chunks = kbText
    .split("\n")
    .map(c => c.trim())
    .filter(c => c.length > 0);

  // STEP 1
  activateStep("step1");

  output.innerHTML += `
    <div class="output-section">
      <div class="label">Document Chunks</div>
      <div class="box">
        ${chunks.map(c => `<span class="chip">${c}</span>`).join("")}
      </div>
    </div>
  `;

  await sleep(1200);

  // STEP 2
  activateStep("step2");

  const embeddings = chunks.map(chunk => {
    return {
      text: chunk,
      vector: createEmbedding(chunk)
    };
  });

  output.innerHTML += `
    <div class="output-section">
      <div class="label">Vector Embeddings</div>
      <div class="box">
        Semantic vectors created for all chunks.
      </div>
    </div>
  `;

  await sleep(1200);

  // STEP 3
  activateStep("step3");

  const queryEmbedding = createEmbedding(query);

  output.innerHTML += `
    <div class="output-section">
      <div class="label">Query Embedding</div>
      <div class="box">
        ${queryEmbedding.join(", ")}
      </div>
    </div>
  `;

  await sleep(1200);

  // STEP 4
  activateStep("step4");

  const ranked = embeddings.map(item => {

    return {
      text: item.text,
      score: similarityScore(queryEmbedding, item.vector)
    };

  }).sort((a, b) => b.score - a.score);

  const topChunks = ranked.slice(0, 2);

  output.innerHTML += `
    <div class="output-section">
      <div class="label">Retrieved Chunks</div>
      <div class="box">
        ${topChunks.map(c =>
          `<span class="chip">${c.text} (score: ${c.score})</span>`
        ).join("")}
      </div>
    </div>
  `;

  await sleep(1200);

  // STEP 5
  activateStep("step5");

  const prompt = `
System:
Answer only using provided context.

Context:
${topChunks.map(c => "- " + c.text).join("\n")}

User:
${query}
  `;

  output.innerHTML += `
    <div class="output-section">
      <div class="label">Augmented Prompt</div>
      <div class="box">
        <pre>${prompt}</pre>
      </div>
    </div>
  `;

  await sleep(1200);

  // STEP 6
  activateStep("step6");

  const response = `
RAG improves LLM responses by retrieving relevant external knowledge before generation.
This helps the model produce more accurate, contextual, and grounded answers while reducing hallucinations.
  `;

  output.innerHTML += `
    <div class="output-section">
      <div class="label">Generated Response</div>
      <div class="box response">
        ${response}
      </div>
    </div>
  `;
}

</script>

</body>
</html>
